<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Blast Ball</title>
  <link rel="icon" href="data:," />
  <style>
    html, body { margin: 0; height: 100%; background: #86bfff; overflow: hidden; }
    #game { position: fixed; inset: 0; }
    .hud { font-family: "Press Start 2P", monospace !important; color: #fff; text-shadow: 2px 2px 0 #0008; user-select: none; font-size: 11px; }
    .hud > * { position: absolute; }
    .hud:not(.playing) > :not(.ov) { display: none; }
    .score { top: 14px; left: 50%; transform: translateX(-50%); display: flex; gap: 0; background: #0b1020d0; border: 2px solid #fff3; }
    .score span { padding: 8px 14px; font-size: 18px; }
    .score .o { background: #ff7a1a; } .score .b { background: #2a7fff; }
    #clock { min-width: 64px; text-align: center; } #clock.low { color: #ff5050; }
    #sub { top: 62px; left: 0; right: 0; text-align: center; color: #9fd8ff; font-size: 12px; }
    #map { top: 14px; left: 14px; border: 2px solid #fff5; image-rendering: pixelated; }
    #feed { top: 14px; right: 14px; text-align: right; font-size: 9px; line-height: 2.2; font-family: system-ui, sans-serif; font-size: 13px; }
    #feed div { background: #0008; padding: 2px 8px; margin-bottom: 4px; transition: opacity .6s; } #feed .fade { opacity: 0; } #feed .w { color: #ffd060; font-size: 11px; }
    #cross { left: 50%; top: 50%; width: 22px; height: 22px; transform: translate(-50%, -50%); }
    #cross i { position: absolute; background: #fff; box-shadow: 0 0 2px #000; }
    #cross i:nth-child(1) { left: 10px; top: 0; width: 2px; height: 7px; } #cross i:nth-child(2) { left: 10px; bottom: 0; width: 2px; height: 7px; }
    #cross i:nth-child(3) { top: 10px; left: 0; width: 7px; height: 2px; } #cross i:nth-child(4) { top: 10px; right: 0; width: 7px; height: 2px; }
    #hitx { left: 50%; top: 50%; transform: translate(-50%, -50%); font-size: 22px; opacity: 0; font-family: system-ui; }
    #charge { left: 50%; top: calc(50% + 34px); transform: translateX(-50%); width: 120px; height: 8px; border: 2px solid #fff; background: #0006; opacity: 0; }
    #chargeFill { height: 100%; width: 0; background: linear-gradient(90deg, #7dff9a, #ffd060, #ff5050); }
    #dmg { inset: 0; pointer-events: none; }
    .dn { position: absolute; transform: translate(-50%, -50%); font-size: 12px; animation: dn .7s ease-out forwards; }
    @keyframes dn { from { margin-top: 0; opacity: 1; } to { margin-top: -40px; opacity: 0; } }
    .status { bottom: 18px; left: 50%; transform: translateX(-50%); width: 300px; }
    .bar { height: 12px; background: #0009; border: 2px solid #fff4; margin-top: 4px; } .bar div { height: 100%; transition: width .15s; }
    .bar.armor { height: 6px; } #ar { background: #66aaff; } #hp { background: linear-gradient(#ff5a5a, #c01818); } .bar.st { height: 5px; } #st { background: #eee; }
    .weap { bottom: 18px; right: 18px; text-align: right; line-height: 2; } #ammo { font-size: 26px; } #gloo { color: #bff4ff; font-size: 10px; }
    #banner { top: 26%; left: 0; right: 0; text-align: center; font-size: 56px; opacity: 0; text-shadow: 4px 4px 0 #000a; line-height: 1.3; }
    #banner small { font-size: 16px; color: #fff; }
    #banner.show { animation: ban 2.6s ease-out forwards; }
    @keyframes ban { 0% { opacity: 0; transform: scale(2); } 12% { opacity: 1; transform: scale(1); } 80% { opacity: 1; } 100% { opacity: 0; } }
    #note { bottom: 110px; left: 0; right: 0; text-align: center; font-size: 12px; transition: opacity .5s; }
    #ballhint { bottom: 90px; left: 0; right: 0; text-align: center; font-size: 9px; color: #ccc; }
    #zoneTint { inset: 0; background: radial-gradient(transparent 40%, rgba(40,120,255,.45)); opacity: 0; transition: opacity .3s; pointer-events: none; }
    .ov { inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; background: linear-gradient(#0007, #0003 50%, #000a); pointer-events: auto; cursor: pointer; padding: 16px; }
    .ov h1 { margin: 0; font-size: clamp(36px, 8vw, 84px); color: #ff7a1a; text-shadow: 5px 5px 0 #000a; letter-spacing: 3px; }
    .ov h1 span { color: #2a7fff; margin-left: 18px; }
    .ov p { margin: 0; line-height: 2.1; } .ov .sub { color: #ffd060; } .ov .keys { font-size: 9px; color: #eee; } .ov .dim { color: #bbb; font-size: 9px; }
    .ov .big { font-size: 40px; }
    .ov .go { color: #7dff9a; animation: blink 1.1s steps(2) infinite; } @keyframes blink { 50% { opacity: .3; } }
    .hidden { display: none !important; }
    @media (max-width: 700px) { #map { width: 92px; height: 140px; } .status { width: 200px; } #feed { font-size: 10px; } }
  </style>
</head>
<body>
  <div id="game"></div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
